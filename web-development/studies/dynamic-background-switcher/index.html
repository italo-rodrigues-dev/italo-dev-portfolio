<!DOCTYPE html>
<html lang="en-US">  
    <head>  
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dynamic Background Switcher</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
       <div>
        Choose a color for the background:<br><br>
        <button class="action-button" data-color="red" id="button-red">Red</button>
        <button class="action-button" data-color="green" id="button-green">Green</button>
        <button class="action-button" data-color="blue" id="button-blue">Blue</button>
        <button class="action-button" data-color="random" id="button-random">Random</button>
       </div>
    </body>
</html>
